# Render Blueprint for the Forge OS coach API (server/coach-server.mjs).
# The app itself is hosted on Vercel, so this service never builds the frontend:
# `vite build` needs more memory than Render's free plan gives Node.
services:
  - type: web
    name: forge-os-coach
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    # Root runtime deps (Anthropic SDK, supabase-js), then the server-only ones (web-push).
    buildCommand: npm ci --omit=dev && npm ci --omit=dev --prefix server
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Your Vercel URL. Comma-separate if you add more (e.g. a custom domain).
      - key: ALLOWED_ORIGINS
        value: https://forge-os-black.vercel.app
      # Render generates a random token. Copy it into Profile → AI coach on your phone.
      - key: COACH_ACCESS_TOKEN
        generateValue: true
      # Entered in the Render dashboard; never committed.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COACH_EFFORT
        value: medium
      # Push notifications, Strava import and the notification centre need these.
      # Entered in the Render dashboard; never committed. See DEPLOYMENT.md.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Server only: reads other members' push subscriptions to deliver to them,
      # and the Strava tokens. Never put this in Vercel or the app.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Generate once: cd server && npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        value: mailto:vishal@forge-os.app
